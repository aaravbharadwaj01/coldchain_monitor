<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cold Chain Monitor - Forgot Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container-fluid p-0">
<div class="row g-0 vh-100">

<div class="col-lg-4 left-panel d-none d-lg-flex">
  <div class="left-content">
    <div class="logo-area">
      <i class="fa-solid fa-snowflake"></i>
      <div>
        <h2>ColdChain</h2>
        <span>MONITOR</span>
      </div>
    </div>
    <h1>Recover your account</h1>
    <p>Enter the email linked to your account. We will ask your security question next.</p>
    <img src="../assets/images/truck.png" class="truck" alt="Truck">
  </div>
</div>

<div class="col-lg-8 col-12 right-panel">
  <div class="login-box">
    <h1>Forgot Password</h1>
    <p class="sub-title">Enter your account email to continue</p>

    <form id="forgotForm">
      <div class="mb-4">
        <label>Email</label>
        <input type="email" id="forgotEmail" class="form-control" placeholder="Enter your email" required>
      </div>

      <button class="btn login-btn" id="forgotBtn" type="submit">Continue</button>
      <div id="forgotMessage" class="message"></div>
    </form>

    <div class="signup">
      Remember your password?
      <a href="login.html">Back to Login</a>
    </div>
  </div>
</div>

</div>
</div>

<script>
const API_BASE = "https://coldchain-monitor.onrender.com";

const form = document.getElementById("forgotForm");
const emailInput = document.getElementById("forgotEmail");
const btn = document.getElementById("forgotBtn");
const message = document.getElementById("forgotMessage");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = emailInput.value.trim();
  message.innerHTML = "";
  message.className = "message";

  if (!email) {
    message.className = "message error";
    message.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Please enter your email.';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';

  try {
    const res = await fetch(`${API_BASE}/api/auth/security-question`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Unable to find account");

    sessionStorage.setItem("fp_email", email);
    sessionStorage.setItem("fp_question", data.securityQuestion);
    sessionStorage.setItem("fp_userId", String(data.userId));
    window.location.href = "security-question.html";
  } catch (err) {
    message.className = "message error";
    message.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ${err.message}`;
    btn.disabled = false;
    btn.innerHTML = "Continue";
  }
});
</script>
</body>
</html>
