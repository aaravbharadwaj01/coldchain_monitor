<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cold Chain Monitor - Security Question</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container-fluid p-0">
<div class="row g-0 vh-100">

<div class="col-lg-4 left-panel d-none d-lg-flex">
  <div class="left-content">
    <div class="logo-area">
      <i class="fa-solid fa-snowflake"></i>
      <div>
        <h2>ColdChain</h2>
        <span>MONITOR</span>
      </div>
    </div>
    <h1>Verify it's you</h1>
    <p>Answer the security question stored with your account to continue to your profile.</p>
    <img src="../assets/images/truck.png" class="truck" alt="Truck">
  </div>
</div>

<div class="col-lg-8 col-12 right-panel">
  <div class="login-box">
    <h1>Security Question</h1>
    <p class="sub-title" id="questionText">Loading question…</p>

    <form id="securityForm">
      <div class="mb-4">
        <label>Your Answer</label>
        <input type="text" id="securityAnswer" class="form-control" placeholder="Enter your answer" required autocomplete="off">
      </div>

      <button class="btn login-btn" id="securityBtn" type="submit">Verify Answer</button>
      <div id="securityMessage" class="message"></div>
    </form>

    <div class="signup">
      <a href="login.html">Back to Login</a>
    </div>
  </div>
</div>

</div>
</div>

<script>
const API_BASE = "https://coldchain-monitor.onrender.com";

const email = sessionStorage.getItem("fp_email");
const question = sessionStorage.getItem("fp_question");

if (!email || !question) {
  window.location.href = "forgot-password.html";
}

document.getElementById("questionText").textContent = question;

const form = document.getElementById("securityForm");
const answerInput = document.getElementById("securityAnswer");
const btn = document.getElementById("securityBtn");
const message = document.getElementById("securityMessage");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const answer = answerInput.value.trim();
  message.innerHTML = "";
  message.className = "message";

  if (!answer) {
    message.className = "message error";
    message.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Please enter your answer.';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';

  try {
    const res = await fetch(`${API_BASE}/api/auth/verify-security-answer`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, answer })
    });
    const data = await res.json();

    if (!res.ok) {
      // Wrong answer → message then return to login
      message.className = "message error";
      message.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ${data.error || "Incorrect answer"}`;
      setTimeout(() => {
        sessionStorage.removeItem("fp_email");
        sessionStorage.removeItem("fp_question");
        sessionStorage.removeItem("fp_userId");
        window.location.href = "login.html";
      }, 2200);
      return;
    }

    // Correct → log in session and go to profile (user can change password there)
    localStorage.setItem("isLoggedIn", "true");
    localStorage.setItem("loggedInUser", data.user.email || email);
    localStorage.setItem("loggedInUserId", String(data.user.id));
    localStorage.setItem("loggedInUserName", data.user.name || "");
    if (data.resetToken) {
      sessionStorage.setItem("resetToken", data.resetToken);
    }
    sessionStorage.removeItem("fp_email");
    sessionStorage.removeItem("fp_question");
    sessionStorage.removeItem("fp_userId");

    message.className = "message success";
    message.innerHTML = '<i class="fa-solid fa-circle-check"></i> Verified! Redirecting to profile…';
    setTimeout(() => {
      window.location.href = "../profile/profile.html";
    }, 1000);

  } catch (err) {
    message.className = "message error";
    message.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ${err.message}`;
    btn.disabled = false;
    btn.innerHTML = "Verify Answer";
  }
});
</script>
</body>
</html>
